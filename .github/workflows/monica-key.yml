name: Monica Key Android

on:
  workflow_dispatch:
  push:
    branches:
      - agent/monica-key-live
    paths:
      - "monica-key/**"
      - ".github/workflows/monica-key.yml"
  pull_request:
    paths:
      - "monica-key/**"
      - ".github/workflows/monica-key.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build native Android APK
        run: gradle --no-daemon --stacktrace -p monica-key :app:assembleDebug

      - name: Verify APK
        run: |
          test -s monica-key/app/build/outputs/apk/debug/app-debug.apk
          sha256sum monica-key/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MonicaKey-debug-apk
          path: monica-key/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: monica-key/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: monica-key/server/go.sum

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Test and build blind relay
        run: |
          go mod tidy
          go test ./...
          CGO_ENABLED=0 go build -trimpath -o monica-key-relay .

      - uses: actions/upload-artifact@v4
        with:
          name: MonicaKey-relay-linux-amd64
          path: monica-key/server/monica-key-relay
          if-no-files-found: error
          retention-days: 30
